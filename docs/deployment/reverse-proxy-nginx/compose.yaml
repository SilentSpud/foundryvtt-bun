---
services:
  foundry:
    image: ghcr.io/silentspud/foundryvtt-bun:14
    hostname: my_foundry_host
    environment:
      - FOUNDRY_HOSTNAME=<vtt.example.com>
      - FOUNDRY_PROXY_SSL=true
      - FOUNDRY_PROXY_PORT=443
      - FOUNDRY_TELEMETRY=true
    volumes:
      - "./volumes/foundry_data:/data"
    secrets:
      - source: foundry_secrets
        target: config.json
    networks:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - foundry
    ports:
      # HTTP, redirected to HTTPS.
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - "./nginx/foundry.conf:/etc/nginx/conf.d/default.conf:ro"
      - "./nginx/certs:/etc/nginx/certs:ro"
    networks:
      - backend
    restart: unless-stopped

networks:
  # Not `internal: true`: Foundry needs outbound access to download releases.
  backend:

secrets:
  foundry_secrets:
    file: foundry_secrets.json
