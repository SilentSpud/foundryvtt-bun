---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: foundryvtt
  namespace: foundryvtt
spec:
  # Point at your cluster's Gateway; attaching across namespaces requires its
  # `allowedRoutes` to permit it.
  parentRefs:
    - name: gateway
      namespace: gateway-system
  hostnames:
    - vtt.example.com
  rules:
    - backendRefs:
        - name: foundryvtt
          port: 80
