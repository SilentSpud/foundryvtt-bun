---
services:
  foundry:
    image: ghcr.io/silentspud/foundryvtt-bun:14
    hostname: my_foundry_host
    environment:
      - FOUNDRY_HOSTNAME=<vtt.example.com>
      - FOUNDRY_PROXY_SSL=true
      - FOUNDRY_TELEMETRY=true
    volumes:
      - "./volumes/foundry_data:/data"
    secrets:
      - source: foundry_secrets
        target: config.json
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - foundry
    environment:
      - SITE_ADDRESS=<vtt.example.com>
    ports:
      # HTTP, used for ACME challenges and redirecting to HTTPS.
      - "80:80/tcp"
      - "443:443/tcp"
      # HTTP/3 (QUIC).
      - "443:443/udp"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "caddy_data:/data"
      - "caddy_config:/config"
    restart: unless-stopped

volumes:
  caddy_config:
  caddy_data:

secrets:
  foundry_secrets:
    file: foundry_secrets.json
