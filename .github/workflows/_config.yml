---
name: Config

permissions: {}

on:
  workflow_call:
    inputs:
      platforms:
        description: The platforms to build (JSON array string)
        default: >-
          ["linux/amd64","linux/arm64"]
        required: false
        type: string
    outputs:
      container_version:
        description: The container version from package.json
        value: ${{ jobs.config.outputs.container_version }}
      foundry_version:
        description: The derived Foundry major.build version
        value: ${{ jobs.config.outputs.foundry_version }}
      image_name:
        description: The container image name
        value: ${{ jobs.config.outputs.image_name }}
      image_name_preinstall:
        description: The pre-install container image name
        value: ${{ jobs.config.outputs.image_name_preinstall }}
      platforms:
        description: The platforms to build (JSON array string)
        value: ${{ inputs.platforms }}
      test_platforms:
        description: The platform to use for testing (JSON array string)
        value: '["linux/amd64"]'

jobs:
  config:
    name: Configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      container_version: ${{ steps.version.outputs.container_version }}
      foundry_version: ${{ steps.version.outputs.foundry_version }}
      image_name: ${{ steps.image.outputs.name }}
      image_name_preinstall: ${{ steps.image.outputs.name }}-preinstall
    steps:
      # Registries require lowercase names, and expressions cannot lowercase.
      - name: Derive image names from the repository owner
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=${OWNER,,}/foundryvtt-bun" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # tag=v2.2.0
        with:
          bun-version-file: package.json
      - name: Emit version outputs
        id: version
        run: bun tools/version.ts --github-output >> "$GITHUB_OUTPUT"
