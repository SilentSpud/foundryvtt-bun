---
name: Config

permissions: {}

on:
  workflow_call:
    inputs:
      platforms:
        description: The platforms to build (JSON array string)
        default: >-
          ["linux/amd64","linux/arm64"]
        required: false
        type: string
    outputs:
      container_version:
        description: The container version from package.json
        value: ${{ jobs.config.outputs.container_version }}
      foundry_version:
        description: The derived Foundry major.build version
        value: ${{ jobs.config.outputs.foundry_version }}
      image_name:
        description: The container image name
        value: ${{ jobs.config.outputs.image_name }}
      platforms:
        description: The platforms to build (JSON array string)
        value: ${{ inputs.platforms }}
      test_platforms:
        description: The platform to use for testing (JSON array string)
        value: '["linux/amd64"]'
      release_version:
        description: The version a v* tag push releases; empty for other events
        value: ${{ jobs.config.outputs.release_version }}
      release_prerelease:
        description: Whether the release is a prerelease
        value: ${{ jobs.config.outputs.release_prerelease }}
      release_latest:
        description: Whether the release becomes the latest one
        value: ${{ jobs.config.outputs.release_latest }}

jobs:
  config:
    name: Configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      container_version: ${{ steps.version.outputs.container_version }}
      foundry_version: ${{ steps.version.outputs.foundry_version }}
      image_name: ${{ steps.image.outputs.name }}
      release_version: ${{ steps.release.outputs.version }}
      release_prerelease: ${{ steps.release.outputs.prerelease }}
      release_latest: ${{ steps.release.outputs.latest }}
    steps:
      # Registries require lowercase names, and expressions cannot lowercase.
      - name: Derive the image name from the repository owner
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=${OWNER,,}/foundryvtt-bun" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # tag=v2.2.0
        with:
          bun-version-file: package.json
      - name: Emit version outputs
        id: version
        run: bun tools/version.ts --github-output >> "$GITHUB_OUTPUT"
      # A version with a suffix (14.369.0-rc.1) is a prerelease, and a release
      # is the latest unless a newer one is already published.
      - name: Classify the release
        id: release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.container_version }}
        run: |
          if [[ "$TAG" != "v${VERSION}" ]]; then
            echo "::error::Tag ${TAG} does not match the package.json version ${VERSION}."
            exit 1
          fi
          prerelease=false
          latest=false
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=true
          else
            # Prints nothing until the first release; gh api would print the
            # 404 body instead, which sorts above any version.
            current=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2> /dev/null || true)
            newest=$(printf '%s\n%s\n' "${current#v}" "$VERSION" | sort -V | tail -n 1)
            if [[ "$newest" == "$VERSION" ]]; then
              latest=true
            fi
          fi
          {
            echo "version=${VERSION}"
            echo "prerelease=${prerelease}"
            echo "latest=${latest}"
          } >> "$GITHUB_OUTPUT"
