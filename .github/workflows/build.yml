---
name: Build

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
    branches:
      - develop
      - develop-*
  release:
    types:
      - edited
      - published
  schedule:
    - cron: 0 10 * * *
  workflow_dispatch:

# errtrace, nounset, errexit, and pipefail; -x echoes each command.
defaults:
  run:
    shell: bash -Eueo pipefail -x {0}

concurrency:
  # The full ref keeps push, PR, and merge-queue runs from cancelling each
  # other; a cancelled cross-event `CI Gate` counted as a failed required check.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  diagnostics:
    name: Diagnostics
    uses: felddy/reusable-workflows/.github/workflows/diagnostics.yml@8a2ace3a3358dad0f5269a4c47397d3d03156a20 # tag=v4.2.1

  config:
    name: Config
    uses: ./.github/workflows/_config.yml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # tag=v2.22.1
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # tag=v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run typecheck
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # tag=v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit on all files
        run: pipx run pre-commit run --all-files --show-diff-on-failure

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # tag=v2.22.1
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # tag=v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bun test tests/unit

  build:
    name: Build and Publish Container
    needs:
      - config
      - lint
      - unit-test
      - diagnostics
    # Fork PRs have no secrets and a read-only GITHUB_TOKEN, so pushes would fail.
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: felddy/reusable-workflows/.github/workflows/container-build.yml@8a2ace3a3358dad0f5269a4c47397d3d03156a20 # tag=v4.2.1
    with:
      platforms: ${{ needs.config.outputs.platforms }}
      image-name: ${{ needs.config.outputs.image_name }}
      context: .
      dockerfile: ./Dockerfile
      scan-severity: CRITICAL,HIGH
      # Code scanning rejects SARIF not tied to a branch or PR, so release and
      # tag runs still scan but skip the upload.
      upload-scan-results: >-
        ${{ github.event_name == 'pull_request'
          || github.event_name == 'merge_group'
          || startsWith(github.ref, 'refs/heads/') }}
      build-args: |
        CONTAINER_VERSION=${{ needs.config.outputs.container_version }}
        FOUNDRY_VERSION=${{ needs.config.outputs.foundry_version }}

  build-preinstalled:
    name: Build and Publish Container Pre-Installed
    needs:
      - config
      - lint
      - unit-test
      - diagnostics
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: felddy/reusable-workflows/.github/workflows/container-build.yml@8a2ace3a3358dad0f5269a4c47397d3d03156a20 # tag=v4.2.1
    with:
      build-secret-1-name: foundry_password
      build-secret-2-name: foundry_username
      cache-scope: preinstall # prevent preinstall from skipping from regular build cache
      platforms: ${{ needs.config.outputs.test_platforms }}
      image-name: ${{ needs.config.outputs.image_name_preinstall }}
      context: .
      dockerfile: ./Dockerfile
      scan-severity: "" # don't fail on vulns in FoundryVTT binaries
      upload-scan-results: false # don't pollute repo security tab with third-party vulns
      build-args: |
        CONTAINER_VERSION=${{ needs.config.outputs.container_version }}
        FOUNDRY_VERSION=${{ needs.config.outputs.foundry_version }}
    secrets:
      private-package-token: ${{ secrets.PRIVATE_PACKAGE_TOKEN }}
      build-secret-1: ${{ secrets.FOUNDRY_PASSWORD }}
      build-secret-2: ${{ secrets.FOUNDRY_USERNAME }}

  test:
    name: Test Container
    needs:
      - config
      - build
    uses: ./.github/workflows/_container-test.yml
    permissions:
      actions: read
      contents: read
      packages: read
    with:
      image-name: ${{ needs.config.outputs.image_name }}
      platforms: ${{ needs.config.outputs.test_platforms }}
    secrets:
      foundry-username: ${{ secrets.FOUNDRY_USERNAME }}
      foundry-password: ${{ secrets.FOUNDRY_PASSWORD }}

  test-preinstalled:
    name: Test Container Pre-Installed
    needs:
      - config
      - build-preinstalled
    uses: ./.github/workflows/_container-test.yml
    permissions:
      actions: read
      contents: read
      packages: read
    with:
      image-name: ${{ needs.config.outputs.image_name_preinstall }}
      platforms: ${{ needs.config.outputs.test_platforms }}
    secrets:
      registry-token: ${{ secrets.PRIVATE_PACKAGE_TOKEN }}

  ci-gate:
    name: CI Gate
    # The only check branch protection requires; keep the name stable so job
    # changes never need a ruleset edit.
    needs:
      - config
      - lint
      - unit-test
      - diagnostics
      - build
      - build-preinstalled
      - test
      - test-preinstalled
    # Not `always()`, which also runs on cancellation and reports a spurious
    # failure; `!cancelled()` still runs after a dependency fails.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          # These jobs run on every event and must pass:
          [[ "${{ needs.config.result }}"      == success ]] || { echo "config: ${{ needs.config.result }}";           exit 1; }
          [[ "${{ needs.lint.result }}"        == success ]] || { echo "lint: ${{ needs.lint.result }}";               exit 1; }
          [[ "${{ needs['unit-test'].result }}" == success ]] || { echo "unit-test: ${{ needs['unit-test'].result }}"; exit 1; }
          [[ "${{ needs.diagnostics.result }}" == success ]] || { echo "diagnostics: ${{ needs.diagnostics.result }}"; exit 1; }
          # Skipped on fork PRs, which have no secrets:
          [[ "${{ needs.build.result }}"              =~ ^(success|skipped)$ ]] || { echo "build: ${{ needs.build.result }}";                           exit 1; }
          [[ "${{ needs['build-preinstalled'].result }}" =~ ^(success|skipped)$ ]] || { echo "build-preinstalled: ${{ needs['build-preinstalled'].result }}"; exit 1; }
          [[ "${{ needs.test.result }}"               =~ ^(success|skipped)$ ]] || { echo "test: ${{ needs.test.result }}";                             exit 1; }
          [[ "${{ needs['test-preinstalled'].result }}"  =~ ^(success|skipped)$ ]] || { echo "test-preinstalled: ${{ needs['test-preinstalled'].result }}";   exit 1; }
          echo "All required jobs passed."

  publish-manifest:
    name: Publish Manifest
    needs:
      - config
      - build
      - test
      - test-preinstalled
    uses: felddy/reusable-workflows/.github/workflows/container-publish-manifest.yml@8a2ace3a3358dad0f5269a4c47397d3d03156a20 # tag=v4.2.1
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image-name: ${{ needs.config.outputs.image_name }}
      platforms: ${{ needs.config.outputs.platforms }}

  publish-manifest-preinstalled:
    name: Publish Manifest Pre-Installed
    needs:
      - config
      - build-preinstalled
      - test
      - test-preinstalled
    uses: felddy/reusable-workflows/.github/workflows/container-publish-manifest.yml@8a2ace3a3358dad0f5269a4c47397d3d03156a20 # tag=v4.2.1
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image-name: ${{ needs.config.outputs.image_name_preinstall }}
      platforms: ${{ needs.config.outputs.test_platforms }}
    secrets:
      private-package-token: ${{ secrets.PRIVATE_PACKAGE_TOKEN }}

  mirror-to-dockerhub:
    name: Mirror images to DockerHub
    needs:
      - publish-manifest
      - publish-manifest-preinstalled
      - config
    if: github.event_name == 'release' && !github.event.release.prerelease
    permissions:
      contents: read
      packages: read
    uses: felddy/reusable-workflows/.github/workflows/container-mirror.yml@8a2ace3a3358dad0f5269a4c47397d3d03156a20 # tag=v4.2.1
    with:
      image_name: ${{ needs.config.outputs.image_name }}
      image_tag_names: ${{ needs.publish-manifest.outputs.image-tag-names }}
      target_registry: docker.io
    secrets:
      target-registry-username: ${{ secrets.DOCKER_USERNAME }}
      target-registry-password: ${{ secrets.DOCKER_PASSWORD }}

  publish-readme:
    name: Publish docs to DockerHub
    needs:
      - publish-manifest
      - publish-manifest-preinstalled
      - config
    if: |
      github.event_name == 'release' &&
      !github.event.release.prerelease &&
      needs.publish-manifest.outputs.is-latest == 'true'
    uses: felddy/reusable-workflows/.github/workflows/dockerhub-description.yml@8a2ace3a3358dad0f5269a4c47397d3d03156a20 # tag=v4.2.1
    with:
      image_name: ${{ needs.config.outputs.image_name }}
    secrets:
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
      docker_username: ${{ secrets.DOCKER_USERNAME }}
