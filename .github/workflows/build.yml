---
name: Build

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
    branches:
      - develop
      - develop-*
      - main
    # Pushing a v* tag releases it; see the release job.
    tags:
      - v*
  schedule:
    - cron: 0 10 * * *
  workflow_dispatch:

# errtrace, nounset, errexit, and pipefail; -x echoes each command.
defaults:
  run:
    shell: bash -Eueo pipefail -x {0}

concurrency:
  # The full ref keeps push, PR, and merge-queue runs from cancelling each
  # other; a cancelled cross-event `CI Gate` counted as a failed required check.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  config:
    name: Config
    uses: $/.github/workflows/_config.yml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # tag=v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # tag=v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bun test tests/unit

  scan:
    name: Scan Repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # tag=v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      # Trivy reads package licenses from node_modules, not the lockfiles.
      - name: Install production dependencies
        run: |
          bun install --frozen-lockfile --production --ignore-scripts
          bun install --cwd docker/fvtt-cli --frozen-lockfile --production --ignore-scripts
      # Licenses stay out of code scanning, which would open an alert for
      # every permissive one.
      - name: Scan with Trivy
        run: |
          .github/scripts/trivy.sh fs --scanners vuln,misconfig,secret \
            --format sarif --output trivy-repository.sarif .
      # Code scanning rejects SARIF not tied to a branch or PR, and fork PRs
      # have a read-only token.
      - name: Upload results to code scanning
        if: |
          github.event_name == 'merge_group' || startsWith(github.ref, 'refs/heads/') || (
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # tag=v4.39.0
        with:
          category: trivy-repository
          sarif_file: trivy-repository.sarif
      # Misconfigurations are advisory.  HIGH licenses are copyleft ones, which
      # the MIT-licensed bundles cannot carry.
      - name: Fail on vulnerabilities, secrets, or copyleft licenses
        run: |
          .github/scripts/trivy.sh fs --skip-db-update --scanners vuln,secret,license \
            --severity HIGH,CRITICAL --exit-code 1 .

  # Job-level `if:` cannot read secrets, so report which optional ones exist.
  secret-check:
    name: Check optional secrets
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      dockerhub: ${{ steps.check.outputs.dockerhub }}
    steps:
      - name: Check optional secrets
        id: check
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          dockerhub=false
          if [[ -n "$DOCKER_USERNAME" && -n "$DOCKER_PASSWORD" ]]; then
            dockerhub=true
          fi
          echo "dockerhub=${dockerhub}" >> "$GITHUB_OUTPUT"

  build:
    name: Build Container
    needs:
      - config
      - lint
      - unit-test
    # Fork PRs have no secrets and a read-only GITHUB_TOKEN, so pushes would fail.
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: $/.github/workflows/_container-build.yml
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      image-name: ${{ needs.config.outputs.image_name }}
      platforms: ${{ needs.config.outputs.platforms }}
      target: image
      container-version: ${{ needs.config.outputs.container_version }}
      foundry-version: ${{ needs.config.outputs.foundry_version }}
      scan: true

  test:
    name: Test Container
    needs:
      - config
      - build
    uses: $/.github/workflows/_container-test.yml
    permissions:
      actions: read
      contents: read
      packages: read
    with:
      image-name: ${{ needs.config.outputs.image_name }}
      platforms: ${{ needs.config.outputs.test_platforms }}
    secrets:
      foundry-username: ${{ secrets.FOUNDRY_USERNAME }}
      foundry-password: ${{ secrets.FOUNDRY_PASSWORD }}

  ci-gate:
    name: CI Gate
    # The only check branch protection requires; keep the name stable so job
    # changes never need a ruleset edit.
    needs:
      - config
      - lint
      - unit-test
      - scan
      - secret-check
      - build
      - test
    # Not `always()`, which also runs on cancellation and reports a spurious
    # failure; `!cancelled()` still runs after a dependency fails.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify required jobs succeeded
        run: |
          # These jobs run on every event and must pass:
          [[ "${{ needs.config.result }}"      == success ]] || { echo "config: ${{ needs.config.result }}";           exit 1; }
          [[ "${{ needs.lint.result }}"        == success ]] || { echo "lint: ${{ needs.lint.result }}";               exit 1; }
          [[ "${{ needs['unit-test'].result }}" == success ]] || { echo "unit-test: ${{ needs['unit-test'].result }}"; exit 1; }
          [[ "${{ needs.scan.result }}"        == success ]] || { echo "scan: ${{ needs.scan.result }}";               exit 1; }
          [[ "${{ needs.secret-check.result }}"     == success ]] || { echo "secret-check: ${{ needs.secret-check.result }}";    exit 1; }
          # Skipped on fork PRs:
          [[ "${{ needs.build.result }}" =~ ^(success|skipped)$ ]] || { echo "build: ${{ needs.build.result }}"; exit 1; }
          [[ "${{ needs.test.result }}"  =~ ^(success|skipped)$ ]] || { echo "test: ${{ needs.test.result }}";   exit 1; }
          echo "All required jobs passed."

  publish-manifest:
    name: Publish Manifest
    needs:
      - config
      - build
      - test
    uses: $/.github/workflows/_container-publish.yml
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      image-name: ${{ needs.config.outputs.image_name }}
      platforms: ${{ needs.config.outputs.platforms }}
      release-version: ${{ needs.config.outputs.release_version }}
      prerelease: ${{ needs.config.outputs.release_prerelease == 'true' }}
      latest: ${{ needs.config.outputs.release_latest == 'true' }}
      sbom: true

  release:
    name: Publish the GitHub release
    needs:
      - config
      - publish-manifest
    if: needs.config.outputs.release_version != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the SBOMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'sbom-*' --dir /tmp/sbom
      # Immutable releases reject assets once published, so the SBOMs go on
      # a draft first.  A rerun picks up the draft an earlier attempt left.
      - name: Attach the SBOMs to a draft and publish it
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ needs.config.outputs.image_name }}
          LATEST: ${{ needs.config.outputs.release_latest }}
          PRERELEASE: ${{ needs.config.outputs.release_prerelease }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            gh release create "$TAG" --draft --verify-tag --generate-notes \
              --prerelease="$PRERELEASE"
          elif [[ "$draft" != "true" ]]; then
            echo "::error::Release ${TAG} is already published."
            exit 1
          fi
          assets=()
          for dir in /tmp/sbom/sbom-*/; do
            platform=$(basename "$dir")
            asset="/tmp/${IMAGE_NAME##*/}-${platform#sbom-}.cdx.json"
            mv "${dir}sbom.cdx.json" "$asset"
            assets+=("$asset")
          done
          gh release upload "$TAG" "${assets[@]}" --clobber
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE" --latest="$LATEST"

  mirror-to-dockerhub:
    name: Mirror images to Docker Hub
    needs:
      - config
      - secret-check
      - publish-manifest
    if: |
      needs.config.outputs.release_version != '' &&
      needs.config.outputs.release_prerelease != 'true' &&
      needs.secret-check.outputs.dockerhub == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR and Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
          docker login docker.io --username "$DOCKER_USERNAME" --password-stdin <<< "$DOCKER_PASSWORD"
      - name: Copy each tag
        env:
          IMAGE_NAME: ${{ needs.config.outputs.image_name }}
          TAG_NAMES: ${{ needs.publish-manifest.outputs.tag-names }}
        run: |
          for tag in $TAG_NAMES; do
            docker buildx imagetools create \
              --tag "docker.io/${IMAGE_NAME}:${tag}" "ghcr.io/${IMAGE_NAME}:${tag}"
          done

  publish-readme:
    name: Publish README to Docker Hub
    needs:
      - config
      - secret-check
      - publish-manifest
    if: |
      needs.config.outputs.release_latest == 'true' &&
      needs.secret-check.outputs.dockerhub == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false
      - name: Update the Docker Hub overview
        env:
          BLOB_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}
          DESCRIPTION: ${{ github.event.repository.description }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_NAME: ${{ needs.config.outputs.image_name }}
        run: |
          # Docker Hub resolves no relative links and caps the overview at
          # 25,000 characters, so absolutize links and cut at a paragraph break.
          sed -E "s|\]\((\./)?([^)#:]+)\)|](${BLOB_URL}/\2)|g" README.md > /tmp/readme.md
          if (( $(wc -c < /tmp/readme.md) > 24000 )); then
            head -c 24000 /tmp/readme.md | sed '$d' \
              | awk '/^$/{last=NR} {lines[NR]=$0} END{for (i = 1; i < last; i++) print lines[i]}' \
              > /tmp/short.md
            printf '\nThe full documentation is in the [README](%s/README.md).\n' "$BLOB_URL" >> /tmp/short.md
            mv /tmp/short.md /tmp/readme.md
          fi
          set +x
          token=$(jq -n --arg u "$DOCKER_USERNAME" --arg p "$DOCKER_PASSWORD" \
              '{identifier: $u, secret: $p}' \
            | curl --fail --silent --show-error --json @- \
              https://hub.docker.com/v2/auth/token | jq -r .access_token)
          # Not in Docker Hub's published API reference, but it is the endpoint
          # the Docker Hub web UI uses to save the overview.
          jq -n --rawfile full /tmp/readme.md --arg short "${DESCRIPTION:0:100}" \
              '{full_description: $full, description: $short}' \
            | curl --fail --silent --show-error --output /dev/null --request PATCH \
              --header "Authorization: Bearer ${token}" --json @- \
              "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/"
