---
name: Label pull requests

on:
  # Default activity types:
  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request
  pull_request:

# errtrace, nounset, errexit, and pipefail; -x echoes each command.
defaults:
  run:
    shell: bash -Eueo pipefail -x {0}

jobs:
  diagnostics:
    name: Run diagnostics
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      # Every job must start with a copy of this step.
      - name: Apply standard cisagov job preamble
        uses: cisagov/action-job-preamble@v1
        with:
          check_github_status: "true"
          # Its MITM proxy hogs or leaks memory (cisagov/skeleton-generic#207).
          monitor_permissions: "false"
          output_workflow_context: "true"
          # Org-level by default; a repo-level ACTIONS_PERMISSIONS_CONFIG overrides it.
          permissions_monitoring_config: ${{ vars.ACTIONS_PERMISSIONS_CONFIG }}
  label:
    needs:
      - diagnostics
    permissions:
      # Permissions required by actions/labeler
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Apply standard cisagov job preamble
        uses: cisagov/action-job-preamble@v1
        with:
          # Its MITM proxy hogs or leaks memory (cisagov/skeleton-generic#207).
          monitor_permissions: "false"
          # Org-level by default; a repo-level ACTIONS_PERMISSIONS_CONFIG overrides it.
          permissions_monitoring_config: ${{ vars.ACTIONS_PERMISSIONS_CONFIG }}
      - name: Apply suitable labels to a pull request
        uses: actions/labeler@v7
      # actions/labeler matches paths only, and package.json changes with
      # every dependency update, so look for the version line itself.
      - name: Label version bumps
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          diff=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY")
          if awk '/^diff --git /{f=($3=="a/package.json")}
                  f && /^[-+]  "version":/{found=1}
                  END{exit !found}' <<< "$diff"; then
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" \
              --add-label "version bump :bookmark:"
          fi
