---
name: Label auto-merge PRs

on:
  # Needed for a write token on fork PRs; the job never checks out or runs
  # PR code, and event data reaches the shell only through env.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - auto_merge_enabled
      - auto_merge_disabled

# errtrace, nounset, errexit, and pipefail; -x echoes each command.
defaults:
  run:
    shell: bash -Eueo pipefail -x {0}

permissions: {}

jobs:
  add-remove-label:
    name: Update the auto-merge label
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # pull_request_target runs with a write token, so event data reaches the
      # shell only through the environment, never through an expression.
      - name: Update label
        env:
          ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
          LABEL_NAME: "automerge :bell:"
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$ACTION" == "auto_merge_enabled" ]]; then
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label "$LABEL_NAME"
          elif [[ "$ACTION" == "auto_merge_disabled" ]]; then
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL_NAME"
          fi
