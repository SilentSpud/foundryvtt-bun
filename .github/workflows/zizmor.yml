---
name: zizmor

on:
  pull_request:
    paths:
      - .github/**
  push:
    branches:
      - main
    paths:
      - .github/**
  # New audits ship with new zizmor releases, so recheck unchanged workflows.
  schedule:
    - cron: 0 11 * * 1
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Audit workflows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # tag=v0.8.0
        with:
          # Fork PRs cannot upload SARIF, so they fail on findings instead.
          advanced-security: >-
            ${{ github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository }}
          version: 1.31.1
