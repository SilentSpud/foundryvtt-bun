---
name: Build container image

# Builds one bake target per platform and pushes it by digest only; the
# publish workflow tags the multi-platform manifest once tests pass.

permissions: {}

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name without registry (e.g. owner/image)
        required: true
        type: string
      platforms:
        description: JSON array of platforms to build (e.g. '["linux/amd64"]')
        required: true
        type: string
      target:
        description: The docker-bake.hcl target to build
        required: true
        type: string
      container-version:
        description: The container version (x.y.z)
        required: true
        type: string
      foundry-version:
        description: The Foundry version (generation.build)
        required: true
        type: string
      scan:
        description: >
          Scan the pushed image with Trivy, failing on HIGH or CRITICAL
          vulnerabilities or copyleft licenses in its npm packages.
        required: false
        type: boolean
        default: false

# errtrace, nounset, errexit, and pipefail; -x echoes each command.
defaults:
  run:
    shell: bash -Eueo pipefail -x {0}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      IMAGE_REPO: ghcr.io/${{ inputs.image-name }}
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false

      - name: Derive slugs
        id: slugs
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "image=${IMAGE_NAME//\//-}" >> "$GITHUB_OUTPUT"
          echo "platform=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: docker login ghcr.io --username "$REGISTRY_USER" --password-stdin <<< "$REGISTRY_TOKEN"

      # The default docker driver cannot push by digest or export a cache.
      - name: Create a BuildKit builder
        run: docker buildx create --name ci --driver docker-container --use --bootstrap

      - name: Build and push by digest
        id: build
        env:
          CONTAINER_VERSION: ${{ inputs.container-version }}
          FOUNDRY_VERSION: ${{ inputs.foundry-version }}
          PLATFORM: ${{ matrix.platform }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          TARGET: ${{ inputs.target }}
          # Registry caches live beside the image, so no Actions cache token is needed.
          CACHE_REF: ghcr.io/${{ inputs.image-name }}:buildcache-${{ steps.slugs.outputs.platform }}
        run: |
          sets=(
            --set "${TARGET}.platform=${PLATFORM}"
            --set "${TARGET}.tags=${IMAGE_REPO}"
            --set "${TARGET}.output=type=image,name=${IMAGE_REPO},push-by-digest=true,name-canonical=true,push=true"
            --set "${TARGET}.cache-from=type=registry,ref=${CACHE_REF}"
            --set "${TARGET}.cache-to=type=registry,ref=${CACHE_REF},mode=max"
            --set "${TARGET}.labels.org.opencontainers.image.revision=${GITHUB_SHA}"
            --set "${TARGET}.labels.org.opencontainers.image.version=${CONTAINER_VERSION}"
            --set "${TARGET}.labels.org.opencontainers.image.source=${REPO_URL}"
          )
          docker buildx bake "$TARGET" "${sets[@]}" \
            --provenance=false --sbom=false --metadata-file /tmp/bake.json
          digest=$(jq -r --arg t "$TARGET" '.[$t]["containerimage.digest"]' /tmp/bake.json)
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Unexpected digest: ${digest}"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          if-no-files-found: error
          name: digests-${{ steps.slugs.outputs.image }}-${{ steps.slugs.outputs.platform }}
          path: /tmp/digests/*
          retention-days: 1

      - name: Scan with Trivy
        if: inputs.scan
        env:
          REF: ${{ env.IMAGE_REPO }}@${{ steps.build.outputs.digest }}
          TRIVY_USERNAME: ${{ env.REGISTRY_USER }}
          TRIVY_PASSWORD: ${{ env.REGISTRY_TOKEN }}
        run: |
          .github/scripts/trivy.sh image --scanners vuln \
            --format sarif --output trivy-image.sarif "$REF"

      # Code scanning rejects SARIF not tied to a branch or PR.
      - name: Upload results to code scanning
        if: |
          inputs.scan && (
            github.event_name == 'pull_request' || github.event_name == 'merge_group' ||
            startsWith(github.ref, 'refs/heads/'))
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # tag=v4.39.0
        with:
          category: trivy-image-${{ steps.slugs.outputs.platform }}
          sarif_file: trivy-image.sarif

      # Debian findings are advisory: the daily rebuild picks up their fixes,
      # and Trivy rates every GPL package license HIGH.
      - name: Fail on npm package vulnerabilities or copyleft licenses
        if: inputs.scan
        env:
          REF: ${{ env.IMAGE_REPO }}@${{ steps.build.outputs.digest }}
          TRIVY_USERNAME: ${{ env.REGISTRY_USER }}
          TRIVY_PASSWORD: ${{ env.REGISTRY_TOKEN }}
        run: |
          .github/scripts/trivy.sh image --skip-db-update --scanners vuln,license \
            --pkg-types library --severity HIGH,CRITICAL --exit-code 1 "$REF"
