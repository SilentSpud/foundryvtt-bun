---
name: Scorecards supply-chain security

on: # yamllint disable-line rule:truthy
  # Only the default branch is supported.
  branch_protection_rule:
  schedule:
    - cron: 43 4 * * 4
  push:
    branches:
      - develop

permissions: read-all

jobs:
  analysis:
    name: Scorecards analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      # Used to receive a badge.
      id-token: write
      # Needs for private repositories.
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # tag=v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # A read-only PAT enables the Branch-Protection check on public repos:
          # https://github.com/ossf/scorecard-action#authentication-with-pat
          # repo_token: ${{ secrets.SCORECARD_READ_TOKEN }}

          # Enables scorecard badges; forced to false on private repositories.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # tag=v4.39.0
        with:
          sarif_file: results.sarif
