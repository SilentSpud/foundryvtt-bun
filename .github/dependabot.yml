---
# Any ignore directives should be uncommented in downstream projects to disable
# Dependabot updates for the given dependency. Downstream projects will get
# these updates when the pull request(s) in the appropriate skeleton are merged
# and Lineage processes these changes.

version: 2

updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    labels:
      - "bot :robot:"
      - "dependencies :game_die:"
      - "docker :whale:"
    groups:
      docker-all:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
    labels:
      - "bot :robot:"
      - "dependencies :game_die:"
      - "docker :whale:"
    groups:
      docker-compose-all:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    labels:
      - "bot :robot:"
      - "dependencies :game_die:"
      - "github-actions :octocat:"
    groups:
      github-actions-all:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: daily
    labels:
      - "bot :robot:"
      - "dependencies :game_die:"
      - "typescript :blue_book:"
    groups:
      bun-all:
        applies-to: version-updates
        patterns:
          - "*"
