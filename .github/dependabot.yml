---
version: 2

updates:
  # The root Dockerfile plus image tags in the Kubernetes manifests.
  - package-ecosystem: docker
    directories:
      - /
      - /docs/deployment/kubernetes/manifests
    schedule:
      interval: daily
    labels:
      - "bot :robot:"
      - "dependencies :game_die:"
      - "docker :whale:"
    groups:
      docker-all:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: docker-compose
    directories:
      - /
      - /docs/deployment/cloudflare-tunnel
      - /docs/deployment/reverse-proxy-caddy
      - /docs/deployment/reverse-proxy-nginx
    schedule:
      interval: daily
    labels:
      - "bot :robot:"
      - "dependencies :game_die:"
      - "docker :whale:"
    groups:
      docker-compose-all:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    labels:
      - "bot :robot:"
      - "dependencies :game_die:"
      - "github-actions :octocat:"
    groups:
      github-actions-all:
        applies-to: version-updates
        patterns:
          - "*"

  # The project itself and the Foundry VTT CLI installed into the image.
  - package-ecosystem: bun
    directories:
      - /
      - /docker/fvtt-cli
    schedule:
      interval: daily
    labels:
      - "bot :robot:"
      - "dependencies :game_die:"
      - "typescript :blue_book:"
    groups:
      bun-all:
        applies-to: version-updates
        patterns:
          - "*"
