---
# Every label here must also be defined in .github/labels.yml.

"dependencies :game_die:":
  - changed-files:
      - any-glob-to-any-file:
          - .pre-commit-config.yaml
          - bun.lock
          - package.json

"docker :whale:":
  - changed-files:
      - any-glob-to-any-file:
          - "**/compose*.yml"
          - "**/docker-compose*.yml"
          - "**/Dockerfile*"

"documentation :memo:":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"

"github-actions :octocat:":
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**

"shell script :shell:":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.sh"

"test :test_tube:":
  - changed-files:
      - any-glob-to-any-file:
          - .ansible-lint
          - .mdl_config.yaml
          - compose.yml
          - tests/**

"typescript :blue_book:":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.ts"

"upstream :eyes:":
  - head-branch:
      # Any Lineage pull requests should use this branch.
      - lineage/skeleton

"version bump :bookmark:":
  - changed-files:
      - any-glob-to-any-file:
          - src/version.txt
