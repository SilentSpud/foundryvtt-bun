---
"dependencies :game_die:":
  - changed-files:
      - any-glob-to-any-file:
          - "**/bun.lock"
          - "**/package.json"

"docker :whale:":
  - changed-files:
      - any-glob-to-any-file:
          - "**/compose*.{yml,yaml}"
          - "**/docker-compose*.{yml,yaml}"
          - "**/Dockerfile*"

"documentation :memo:":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"

"github-actions :octocat:":
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**

"shell script :shell:":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.sh"

"test :test_tube:":
  - changed-files:
      - any-glob-to-any-file:
          - .editorconfig
          - .husky/**
          - .oxfmtrc.json
          - tests/**
          - tools/check_files.ts

"typescript :blue_book:":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.ts"
