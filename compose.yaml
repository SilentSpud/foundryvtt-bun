---
services:
  foundry:
    image: ghcr.io/felddy/foundryvtt:release
    hostname: my_foundry_host
    volumes:
      - type: bind
        source: ./data
        target: /data
    # Every setting is substituted from the shell environment or from a .env
    # file next to this file (see .env.example).  Compose reads .env for
    # variable substitution only, so only the variables listed here reach the
    # container.  An unset variable behaves as if it were not set at all; the
    # defaults after ":-" are the container's own defaults.  CONTAINER_CACHE
    # uses "-" so that setting it to an empty value still disables caching.
    #
    # Long values such as lists and JSON go in .env on one line, for example:
    #   CONTAINER_PATCH_URLS="https://example.com/a.sh https://example.com/b.sh"
    #   FOUNDRY_DEMO_CONFIG='{"worldName": "demo-world", "sourceZip": "/data/demo-world.zip", "resetSeconds": 3600}'
    environment:
      - CONTAINER_CACHE=${CONTAINER_CACHE-/data/container_cache}
      - CONTAINER_CACHE_SIZE=${CONTAINER_CACHE_SIZE:-}
      - CONTAINER_PATCHES=${CONTAINER_PATCHES:-}
      - CONTAINER_PATCH_URLS=${CONTAINER_PATCH_URLS:-}
      - CONTAINER_PRESERVE_CONFIG=${CONTAINER_PRESERVE_CONFIG:-}
      - CONTAINER_UMASK=${CONTAINER_UMASK:-}
      - CONTAINER_URL_FETCH_RETRY=${CONTAINER_URL_FETCH_RETRY:-0}
      - CONTAINER_VERBOSE=${CONTAINER_VERBOSE:-}
      - FOUNDRY_ADMIN_KEY=${FOUNDRY_ADMIN_KEY:-atropos}
      - FOUNDRY_AWS_CONFIG=${FOUNDRY_AWS_CONFIG:-}
      - FOUNDRY_COMPRESS_WEBSOCKET=${FOUNDRY_COMPRESS_WEBSOCKET:-}
      - FOUNDRY_CSS_THEME=${FOUNDRY_CSS_THEME:-}
      - FOUNDRY_DELETE_NEDB=${FOUNDRY_DELETE_NEDB:-}
      - FOUNDRY_DEMO_CONFIG=${FOUNDRY_DEMO_CONFIG:-}
      - FOUNDRY_HOSTNAME=${FOUNDRY_HOSTNAME:-}
      - FOUNDRY_HOT_RELOAD=${FOUNDRY_HOT_RELOAD:-}
      - FOUNDRY_IP_DISCOVERY=${FOUNDRY_IP_DISCOVERY:-}
      - FOUNDRY_LANGUAGE=${FOUNDRY_LANGUAGE:-}
      - FOUNDRY_LICENSE_KEY=${FOUNDRY_LICENSE_KEY:-}
      - FOUNDRY_LOCAL_HOSTNAME=${FOUNDRY_LOCAL_HOSTNAME:-}
      - FOUNDRY_LOG_SIZE=${FOUNDRY_LOG_SIZE:-}
      - FOUNDRY_MAX_LOGS=${FOUNDRY_MAX_LOGS:-}
      - FOUNDRY_MINIFY_STATIC_FILES=${FOUNDRY_MINIFY_STATIC_FILES:-}
      - FOUNDRY_NO_BACKUPS=${FOUNDRY_NO_BACKUPS:-}
      - FOUNDRY_PASSWORD=${FOUNDRY_PASSWORD:-}
      - FOUNDRY_PASSWORD_SALT=${FOUNDRY_PASSWORD_SALT:-}
      - FOUNDRY_PROTOCOL=${FOUNDRY_PROTOCOL:-}
      - FOUNDRY_PROXY_PORT=${FOUNDRY_PROXY_PORT:-}
      - FOUNDRY_PROXY_SSL=${FOUNDRY_PROXY_SSL:-}
      - FOUNDRY_RELEASE_URL=${FOUNDRY_RELEASE_URL:-}
      - FOUNDRY_ROUTE_PREFIX=${FOUNDRY_ROUTE_PREFIX:-}
      - FOUNDRY_SERVICE_CONFIG=${FOUNDRY_SERVICE_CONFIG:-}
      - FOUNDRY_SERVICE_KEY=${FOUNDRY_SERVICE_KEY:-}
      - FOUNDRY_SSL_CERT=${FOUNDRY_SSL_CERT:-}
      - FOUNDRY_SSL_KEY=${FOUNDRY_SSL_KEY:-}
      - FOUNDRY_TELEMETRY=${FOUNDRY_TELEMETRY:-true}
      - FOUNDRY_TEMP_DIR=${FOUNDRY_TEMP_DIR:-}
      - FOUNDRY_UNIX_SOCKET=${FOUNDRY_UNIX_SOCKET:-}
      - FOUNDRY_UPNP=${FOUNDRY_UPNP:-}
      - FOUNDRY_UPNP_LEASE_DURATION=${FOUNDRY_UPNP_LEASE_DURATION:-}
      - FOUNDRY_USERNAME=${FOUNDRY_USERNAME:-}
      - FOUNDRY_VERSION=${FOUNDRY_VERSION:-}
      - FOUNDRY_WORLD=${FOUNDRY_WORLD:-}
    ports:
      - target: 30000
        published: 30000
        protocol: tcp
        mode: host
